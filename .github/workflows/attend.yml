name: attend-relay
on:
  workflow_dispatch:
    inputs:
      key:
        description: 比赛 key
        default: IvorySQL
        type: choice
        options: [IvorySQL, IvorySQL_2, SuperRadar, CANN, RocketMQ3, ubml, huatuo,
                  agentUniverse-00002, Higress-00002, opentenbase, Linyaps,
                  Open-supOS, OpenCloudOS-00001, OSS-Compass, Compass-CI-00002,
                  openKylin0002, Agentic_OS_1, CPQCTorchkit_1, open-eBackup_1]
      mode:
        description: userId 来源
        type: choice
        default: real
        options: [real, synthetic]
      count:
        description: 本批人数（逐个写，批间抖动）
        default: "1"
      gap:
        description: 两次写入基础间隔(秒)
        default: "90"
      dry:
        description: 只做只读基线，不写入
        type: boolean
        default: true

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: relay
        env:
          TAIYI_TOKEN: ${{ inputs.dry && '' || secrets.TAIYI_TOKEN }}
          KEY: ${{ inputs.key }}
          MODE: ${{ inputs.mode }}
          COUNT: ${{ inputs.count }}
          GAP: ${{ inputs.gap }}
        run: python3 relay.py
